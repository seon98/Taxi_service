{% load static %}
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10251f"><title>Taxi Safe Toilet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <header><a class="brand" href="/"><span class="brand-mark">T</span><span>Taxi Safe Toilet<small>기사님을 위한 안심 정차 안내</small></span></a><button class="icon-btn" id="refresh" aria-label="다시 검색">↻</button></header>
  <main>
    <section class="hero">
      <div><span class="eyebrow">운행 중 잠깐의 쉼</span><h1>가깝고, 열려 있고,<br><em>정차하기 안전한 곳</em></h1><p>화장실과 주차 정보, 단속 위험, 기사님 제보를 한 번에 확인하세요.</p></div>
      <button class="urgent" id="locate"><span class="pulse">●</span><strong>지금 가까운 곳 찾기</strong><small>현재 위치를 기준으로 추천해요</small></button>
    </section>
    <section class="workspace">
      <div id="map"></div>
      <div class="location-pill" id="locationText">광주광역시청 주변 · 3km</div>
      <aside class="results">
        <div class="results-head"><div><span class="eyebrow">추천 장소</span><h2>안심 점수가 높은 순서예요</h2></div><span id="count">검색 중</span></div>
        <div class="filter-row"><button class="active" data-filter="all">전체</button><button data-filter="open">지금 열림</button><button data-filter="parking">주차장 있음</button></div>
        <div id="cards" class="cards"><div class="loading">주변 안전 정보를 분석하고 있어요…</div></div>
      </aside>
    </section>
  </main>
  <div class="sheet-backdrop" id="backdrop"></div>
  <section class="detail-sheet" id="detail" aria-live="polite"></section>
  <div class="toast" id="toast"></div>
  <script>window.TST_DEFAULT = {lat: {{ default_lat }}, lng: {{ default_lng }}};</script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="{% static 'js/app.js' %}"></script>
</body></html>
